; PlatformIO Project Configuration File
;
; ---------------------------------------------------------------------------
; Desktop Robot - Waveshare ESP32-S3-Touch-LCD-1.69 (Amazon: B0D59P327V)
;
; SoC      : ESP32-S3R8 (Xtensa LX7 dual-core @ 240 MHz, 8 MB octal PSRAM)
; Flash    : 16 MB W25Q128 (QIO)
; USB      : ESP32-S3 NATIVE USB-CDC (GPIO19/20 to Type-C, no UART bridge)
; Display  : 1.69" rect IPS 240x280, ST7789V2 driver, SPI up to 80 MHz
;            (20-px vertical RAM offset, color-inverted)
; Touch    : CST816T capacitive (I2C 0x15)
; IMU      : QMI8658C 6-axis (I2C 0x6B)
; RTC      : PCF85063ATL (I2C 0x51) with SH1.0 coin-cell backup
; Charger  : ETA6098N3A LiPo charger (MX1.25 / PH1.25 battery jack)
; Power    : SYS_EN/SYS_OUT latch on GPIO40/41 -- firmware MUST set SYS_EN
;            HIGH in setup() or the board powers off on battery.
; Buzzer   : Onboard passive piezo on GPIO42 -- use tone()/PWM only.
;
; Wiki      : https://www.waveshare.com/wiki/ESP32-S3-Touch-LCD-1.69
; GitHub    : https://github.com/waveshareteam/ESP32-S3-Touch-LCD-1.69
; ---------------------------------------------------------------------------

[env:esp32-s3-devkitc-1]
; NOTE (DEP-6): This platform pin is COUPLED to two library pins below.
;   espressif32 7.x ships Arduino-ESP32 v2.x. If bumping to a version that
;   moves to Arduino-ESP32 v3.x, also revisit:
;     - `GFX Library for Arduino@1.3.9` (below): 1.4.x REQUIRES Arduino-ESP32 v3.
;     - `ESP32Servo@1.2.1` (below): 3.x changed LEDC channel/timer defaults,
;       which breaks the D12 ch0/ch2/ch4 isolation between servo/piezo/backlight.
;   Also re-verify the LEDC channel/timer assumptions documented in
;   docs/PROJECT-HISTORY.md D12 after any platform bump.
platform              = espressif32@7.0.1
board                 = esp32-s3-devkitc-1
framework             = arduino

monitor_speed         = 115200
upload_speed          = 921600
upload_port           = COM4        ; ESP32-S3 native USB-CDC enumerates here.
monitor_port          = COM4        ; (COM3 on this PC = Intel AMT serial-over-LAN
                                    ;  — DO NOT auto-detect, esptool will time out.)

; ---- ESP32-S3R8 + 16 MB QIO flash, 8 MB OCTAL PSRAM ----
board_build.mcu        = esp32s3
board_build.f_cpu      = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_desktop_robot.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi   ; flash=QIO, PSRAM=OPI (R8 octal)

build_flags =
    -D BOARD_HAS_PSRAM
    ; --- native USB-CDC (no CH343, no UART bridge) ---
    -D ARDUINO_USB_MODE=1            ; native USB on GPIO19/20
    -D ARDUINO_USB_CDC_ON_BOOT=1     ; Serial = USB CDC (not UART0)
    -D CORE_DEBUG_LEVEL=0           ; mute Arduino-ESP32 ESP_LOG noise (we don't use it)
    ; --- ST7789V2 LCD pin map (NEW board revision) ---
    -D LCD_DC=4
    -D LCD_CS=5
    -D LCD_SCK=6
    -D LCD_MOSI=7
    -D LCD_RST=8
    -D LCD_BL=15                     ; backlight, LEDC channel 4/timer 2
    -D LCD_WIDTH=240
    -D LCD_HEIGHT=280
    -D LCD_ROW_OFFSET=20             ; ST7789V2 RAM is 240x320, panel uses rows 20..299
    ; --- shared I2C bus (Touch + IMU + RTC) ---
    -D I2C_SDA=11
    -D I2C_SCL=10
    -D I2C_FREQ_HZ=400000            ; CST816T tops out at 400 kHz
    ; --- CST816T capacitive touch ---
    -D TP_RST=13
    -D TP_INT=14
    -D TP_ADDR=0x15
    ; --- QMI8658C IMU (only INT2 routed on this board) ---
    -D IMU_INT2=38
    -D IMU_ADDR=0x6B
    ; --- PCF85063 RTC ---
    -D RTC_INT=39
    -D RTC_ADDR=0x51
    ; --- onboard passive buzzer ---
    -D BUZZER_PIN=42
    ; --- dual MG90D continuous-rotation signals are constexpr in main.cpp:
    ;     LEFT=GPIO18, RIGHT=GPIO17, 1000..2000us at 50 Hz/14-bit ---
    ; --- power button + battery latch (CRITICAL) ---
    -D SYS_OUT=40                    ; INPUT: power button (low when pressed)
    -D SYS_EN=41                     ; OUTPUT: must drive HIGH in setup() or
                                     ; board cuts battery power on release
    ; --- battery voltage sense ---
    -D BAT_ADC=1                     ; 200k/100k divider (x3 multiplier)
    ; --- external 5V buck-boost EN pin (XL63020 module). State-gated by
    ;     §16: HIGH only when state is RUNNING/GRACE (servos may be commanded);
    ;     LOW in IDLE_DEMO/WIFI_BOOT so the boost doesn't burn idle current. ---
    -D BOOST_EN_GPIO=3

; Dependencies are pinned EXACTLY, not ranged.
;
; They used to use ^ and ~, which float minor/patch, and PlatformIO has no
; lockfile — so `platformio.ini` alone did not determine what got built. That
; was not theoretical: with `ESPAsyncWebServer-esphome@^3.3.0` declared, the
; tree on disk had already floated to 3.4.0, and `ArduinoJson@^7.1.0` to 7.4.3.
;
; That matters here more than in most projects because three fixes depend on the
; exact AsyncTCP/AsyncWebSocket callback contract:
;   - unauthorised WS upgrades refused at the HTTP handshake, because closing a
;     client from inside its own WS_EVT_CONNECT crashed the board
;   - dead clients reaped after 8 s of silence, because a phone leaving WiFi
;     never produces WS_EVT_DISCONNECT
;   - binaryAll() banned, because it starves AsyncTCP (see docs/PROJECT-HISTORY.md)
;
; A silent minor bump could move any of those out from under us, and a green
; build would prove nothing about callback timing. Bumps are now deliberate:
; read the changelog, then bench-test AP connect / WS session / gesture / sound
; on hardware before committing the new pin.
;
; Versions below are the ones resolved and verified working on 2026-08-07.
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    moononournation/GFX Library for Arduino@1.3.9     ; 1.4.x needs ESP32-Arduino v3 (only unlocked
                                                      ; by bumping `platform = espressif32@7.0.1`
                                                      ; above — see DEP-6 note on that line).
                                                      ; lib/EyeEngine/library.json pins the same
                                                      ; exact version; keep them in sync.
    ; ESP32Servo 1.2.1 is PINNED EXACTLY on purpose — do NOT bump.
    ;   Why: newer (3.x-era) versions changed LEDC channel/timer defaults, which
    ;   breaks the D12 channel/timer isolation this project depends on
    ;   (servo=ch0/timer0, piezo=ch2/timer1, backlight=ch4/timer2 — see
    ;   docs/PROJECT-HISTORY.md D12). Two behaviors also depend on this exact
    ;   version's semantics:
    ;     - `writeMicroseconds(0)` (and 1..999) clamps to ~1000 µs = near-full
    ;       speed one direction on a continuous-rotation MG90D. The SafeOff /
    ;       teardown path relies on that being the observed behavior so it
    ;       instead does `Servo::detach()` + drive pin LOW manually.
    ;       (docs/PROJECT-HISTORY.md D11 / R10.)
    ;     - `ledcReadFreq` / `ledcRead` are used to verify what `attach()`
    ;       actually did on hardware because the wrapper is known to lie
    ;       (docs/PROJECT-HISTORY.md D12 / R33 / [064]).
    ;   Do NOT bump without re-doing the motor safety bench.
    madhephaestus/ESP32Servo@1.2.1                    ; MG90D 1000..2000us, 50 Hz, 14-bit
    ; --- Override WebUI (Phase 1: WebSocket + binary frames) ---
    ; The -esphome forks are the actively-maintained replacements for the
    ; original me-no-dev libs (which haven't shipped since 2022 and don't
    ; build cleanly on Arduino-ESP32 v2.x).
    ;
    ; LICENSING NOTE (DEP-5): Both esphome forks are LGPL-3.0. Publishing this
    ; source repository does not remove the obligations that activate when a
    ; compiled firmware image or device is distributed. A binary/device release
    ; must preserve the applicable notices and provide the relinkable/source
    ; materials required by LGPL-3.0 section 4/5. Full scope and remediation
    ; options: LICENSE.md, THIRD_PARTY_NOTICES.md, tools/LICENSING-NOTES.md.
    esphome/AsyncTCP-esphome@2.1.4
    esphome/ESPAsyncWebServer-esphome@3.4.0
    ; --- Override LCD QR code (round 4: scan to join WiFi + open browser) ---
    ; QRCode 0.0.1 is PINNED EXACTLY and DELIBERATELY KEPT despite being
    ; abandoned upstream (single release, 2017; no maintainer activity since).
    ; It has a documented near-capacity encoding bug: at ~93% of a version's
    ; capacity, phones detect the code but silently fail to decode. The current
    ; payload budget WORKS AROUND this by staying at ~67% capacity — WIFI
    ; QR is v4-M, URL QR is v3 (see src/main.cpp:5326-5336 and
    ; docs/PROJECT-HISTORY.md R9 / E22 [057] [058]).
    ; Do NOT swap for a "safer" replacement or widen this pin without re-running
    ; the QR bench: any longer URL or WiFi payload pushed above ~70% capacity
    ; will silently fail on real phones even if it decodes on your desktop.
    ricmoo/QRCode@0.0.1
    ; --- CST816T touchscreen driver (round 5: swipe-to-connect WiFi flow) ---
    mjdonders/CST816_TouchLib@2.2.0
    ; tzapu/WiFiManager@^2.0.17                      ; retired in favor of direct softAP
                                                     ; + DNSServer catch-all for captive portal
                                                     ; (see initOverride in main.cpp)

monitor_filters = esp32_exception_decoder, time

; ---- usage notes ----
; - First flash of a new board (or after deep sleep that disables USB):
;   hold BOOT, tap RESET, release BOOT, then run `pio run -t upload`.
; - Power latch: setup() MUST `pinMode(SYS_EN, OUTPUT); digitalWrite(SYS_EN, HIGH);`
;   as one of the first calls, or the board powers off when the user
;   releases the PWR button on battery.
; - Buzzer: never `digitalWrite(BUZZER_PIN, HIGH)` continuously -- the passive
;   piezo draws DC current and overheats the LDO. Always tone()/noTone() or PWM.
