<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Desktop Robot</title>
  <desc id="desc">An expressive ESP32-S3 desktop robot with a touch display, differential drive, sound, and phone control.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58A6FF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21262D"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363D" stroke-width="1" opacity=".32"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity=".52"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="24" fill="url(#grid)"/>
  <circle cx="965" cy="235" r="250" fill="url(#glow)"/>
  <path d="M0 392C212 330 355 430 552 372S913 301 1200 370V480H0Z" fill="#0B0F14" opacity=".72"/>

  <g transform="translate(72 78)">
    <text x="0" y="0" fill="#58A6FF" font-family="Consolas, monospace" font-size="16" font-weight="700" letter-spacing="3">OPEN HARDWARE / ESP32-S3</text>
    <text x="0" y="74" fill="#E6EDF3" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">DESKTOP ROBOT</text>
    <text x="0" y="122" fill="#A9B4C0" font-family="Segoe UI, Arial, sans-serif" font-size="24">A small robot that communicates before it moves.</text>
    <text x="0" y="158" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="18">Expression, touch, motion, sound, and phone control on one board.</text>

    <g transform="translate(0 210)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">
      <rect width="142" height="42" rx="21" fill="#21262D" stroke="#58A6FF" stroke-opacity=".55"/>
      <text x="71" y="27" text-anchor="middle" fill="#E6EDF3">240 x 280 touch</text>
      <rect x="156" width="137" height="42" rx="21" fill="#21262D" stroke="#A371F7" stroke-opacity=".55"/>
      <text x="224.5" y="27" text-anchor="middle" fill="#E6EDF3">16 expressions</text>
      <rect x="307" width="156" height="42" rx="21" fill="#21262D" stroke="#3FB950" stroke-opacity=".55"/>
      <text x="385" y="27" text-anchor="middle" fill="#E6EDF3">closed-loop drive</text>
    </g>

    <g transform="translate(0 286)">
      <circle cx="8" cy="8" r="8" fill="#3FB950"/>
      <text x="28" y="14" fill="#8B949E" font-family="Consolas, monospace" font-size="15">hardware tested / browser previewable</text>
    </g>
  </g>

  <g transform="translate(790 54)" filter="url(#shadow)">
    <ellipse cx="170" cy="364" rx="172" ry="36" fill="#000000" opacity=".36"/>
    <circle cx="38" cy="316" r="54" fill="#161B22" stroke="#30363D" stroke-width="8"/>
    <circle cx="302" cy="316" r="54" fill="#161B22" stroke="#30363D" stroke-width="8"/>
    <circle cx="38" cy="316" r="22" fill="#58A6FF" opacity=".82"/>
    <circle cx="302" cy="316" r="22" fill="#58A6FF" opacity=".82"/>
    <rect x="20" y="20" width="300" height="330" rx="66" fill="#21262D" stroke="#30363D" stroke-width="8"/>
    <rect x="48" y="42" width="244" height="284" rx="28" fill="url(#screen)" stroke="#58A6FF" stroke-opacity=".5" stroke-width="3"/>

    <g transform="translate(70 74)">
      <path d="M18 50H0V164H18V190H44V208H156V190H182V164H200V50H182V24H156V0H44V24H18Z" fill="#CB67E9"/>
      <path d="M44 36H156V54H182V122H156V148H44V122H18V54H44Z" fill="#67D5DD"/>
      <path d="M44 62H84V110H44ZM116 62H156V110H116Z" fill="#4D0C83"/>
      <path d="M44 122H156V190H44Z" fill="#161927"/>
      <rect x="89" y="122" width="22" height="18" fill="#161927"/>
      <rect x="88" y="144" width="12" height="36" rx="6" fill="#7EE787"/>
      <rect x="108" y="144" width="12" height="36" rx="6" fill="#7EE787"/>
    </g>

    <rect x="132" y="333" width="76" height="10" rx="5" fill="#A371F7"/>
  </g>

  <g fill="none" stroke="#58A6FF" stroke-width="2" opacity=".35">
    <path d="M710 112H754L776 90"/>
    <path d="M694 260H746L770 284"/>
    <circle cx="710" cy="112" r="4" fill="#58A6FF"/>
    <circle cx="694" cy="260" r="4" fill="#58A6FF"/>
  </g>
</svg>
